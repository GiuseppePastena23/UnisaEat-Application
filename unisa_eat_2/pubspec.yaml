name: unisa_eat_2
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
     
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it:
  flutter_bloc:
  dio:
  dio_smart_retry: ^7.0.1
  dartz:
  logger:
  shared_preferences:
  flutter_secure_storage: ^9.2.1
  jwt_decoder:
  go_router:
  qr_flutter:
  google_fonts:
  material_design_icons_flutter:
  hive:
  hive_flutter:
  loading_animation_widget:
  intl:
  flutter_stripe: ^10.1.1
  fl_chart: ^1.1.1
  equatable: ^2.0.8
  local_auth: ^3.0.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.0
  flutter_launcher_icons:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: 
  build_runner: 
  analyzer:
  

flutter:
  uses-material-design: true
  assets:
  - assets/images/
  generate: true

flutter_intl:
  enabled: true
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
